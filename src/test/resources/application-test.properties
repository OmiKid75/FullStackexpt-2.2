# Used by automated tests only (@ActiveProfiles("test")). No MySQL needed.
spring.datasource.url=jdbc:h2:mem:campus_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.root=WARN
logging.level.com.example.campusresources=INFO
