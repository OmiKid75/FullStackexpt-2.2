# =====================================================================
# Campus Library Resource Explorer API - main configuration (MySQL 8)
# Secrets are read from environment variables; nothing real is stored here.
# =====================================================================
spring.application.name=campus-library-resource-explorer-api
server.port=${SERVER_PORT:8080}

# ---------- Database (MySQL 8) ----------
# createDatabaseIfNotExist=true lets MySQL create the schema on first start.
# You can also create it yourself with database/schema.sql.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_library?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# ddl-auto=update : Hibernate creates missing tables/columns/indexes and never drops anything.
#   (create / create-drop DELETE data and must not be used on a real database;
#    use "validate" or "none" in production and manage the schema with migrations.)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Do not keep a Hibernate session open during view rendering. Lazy loading must happen
# inside @Transactional service methods - this is what makes the N+1 demo honest.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Cache (Spring Cache -> JCache -> Ehcache 3) ----------
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# ---------- Errors: never leak stack traces ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------- CORS (no frontend is included; this only allows one to call the API) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.example.campusresources=INFO
# To see every SQL statement start the app with the "sqllog" profile
# (see application-sqllog.properties and the README).
