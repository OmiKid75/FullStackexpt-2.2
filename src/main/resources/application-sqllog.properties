# Activate with:  $env:SPRING_PROFILES_ACTIVE="sqllog"   (PowerShell)
# Prints every SQL statement Hibernate sends to the database, plus bound parameters.
# Useful for counting queries in the N+1 demonstration.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Debug-level logs from this project (cache hit/miss messages are INFO and always visible)
logging.level.com.example.campusresources=DEBUG
